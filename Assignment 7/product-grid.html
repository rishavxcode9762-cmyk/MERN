<!DOCTYPE html>
<html>
<head>
    <title>Product Grid</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 18px;
            background: #222;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        h1 {
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<nav>
    <a href="gallery.html">Gallery</a>
    <a href="product-grid.html">Products</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

<h1>Our Products</h1>

        <button>Buy Now</button>

    </div>

    <div class="card">

        <h3>Headphones</h3>
        <p>₹999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa">
        <h3>Handbag</h3>
        <p>₹1299</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">

    </div>

</div>

</body>
</html>

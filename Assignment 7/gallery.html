<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 18px;
            background: #222;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="gallery.html">Gallery</a>
    <a href="product-grid.html">Products</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

</div>

</body>
</html>

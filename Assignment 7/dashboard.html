<!DOCTYPE html>
<html>
<head>
    <title>My Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f1f5f9;
        }

        .dashboard {
            display: grid;

            grid-template-columns: 220px 1fr;

            grid-template-rows: 70px 1fr 60px;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            min-height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        header {
            grid-area: header;
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        aside {
            grid-area: sidebar;
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        main {
            grid-area: main;
            background: white;
            padding: 25px;
        }

        footer {
            grid-area: footer;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            margin-bottom: 25px;
        }

        .card {
            background: #e2e8f0;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;

                grid-template-rows: auto auto 1fr auto;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header>
        <h2>My Dashboard</h2>
    </header>

    <aside>
        <h3>Menu</h3>

        <a href="gallery.html">Gallery</a>
        <a href="product-grid.html">Products</a>
        <a href="dashboard.html">Dashboard</a>
    </aside>

    <main>
        <h1>Welcome Back!</h1>
        <p>This is your dashboard main section.</p>

        <div class="card">
            <h3>Total Students</h3>
            <h2>250</h2>
        </div>

        <div class="card">
            <h3>Total Courses</h3>
            <h2>15</h2>
        </div>

        <div class="card">
            <h3>Assignments Completed</h3>
            <h2>85%</h2>
        </div>
    </main>

    <footer>
        © 2026 My Dashboard | All Rights Reserved
    </footer>

</div>

</body>
</html>

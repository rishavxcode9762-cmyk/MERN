<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Login</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: #e8eef5;
        }

        .login {
            background: white;
            padding: 35px;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #aaa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, button {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    
<nav class="main-nav">
    <a href="menu.html">Menu</a>
    <a href="login.html">Login</a>
    <a href="products.html">Products</a>
    <a href="navbar-hero.html">Home</a>
</nav>


<div class="login">
    <h2>Login</h2>
    <input type="email" placeholder="Enter Email">
    <input type="password" placeholder="Enter Password">
    <button>Login</button>
</div>

</body>
</html>

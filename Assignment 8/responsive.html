<!DOCTYPE html>
<html>
<head>
    <title>Responsive Website</title>

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 20px 5%;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        /* Heading */
        h1 {
            text-align: center;
            margin: 30px 10px;
        }

        /* Product grid */
        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .card img {
            width: 100%;
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* TABLET BREAKPOINT */
        @media (max-width: 768px) {

            nav {
                padding: 15px;
            }

            .products {
                grid-template-columns:
                    repeat(2, 1fr);
                gap: 15px;
            }

            h1 {
                font-size: 26px;
            }

            .card img {
                height: 150px;
            }
        }

        /* MOBILE BREAKPOINT */
        @media (max-width: 480px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .links a {
                font-size: 14px;
            }

            .products {
                grid-template-columns: 1fr;
                padding: 12px;
                gap: 15px;
            }

            h1 {
                font-size: 22px;
            }

            .card img {
                height: 200px;
            }

            button {
                width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>MY STORE</h2>

    <div class="links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</nav>

<h1>Our Products</h1>

    <div class="card">

    </div>

    <div class="card">

        <h3>Handbag</h3>
        <p>₹1299</p>
        <button>Buy Now</button>

    <div class="card">

    <div class="card">

        <h3>Smartphone</h3>
        <p>₹15999</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
